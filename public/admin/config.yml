backend:
  name: github
  repo: tochilkina-os/site
  branch: main

local_backend: true
publish_mode: simple
media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "site_documents"
    label: "Документы сайта"
    editor:
      preview: false
    files:
      - label: "Образование"
        name: "diploms"
        file: "src/data/diploms.json"
        format: "json"
        fields:
          - label: "Документы"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields: &common_document_fields
              - { label: "Показывать на сайте", name: "visible", widget: "boolean", default: true }
              - { label: "Порядок", name: "order", widget: "number", value_type: "int", default: 10, hint: "Чем меньше число, тем выше карточка." }
              - { label: "Название", name: "title", widget: "string" }
              - { label: "Категория", name: "category", widget: "string", default: "Документ" }
              - { label: "Описание", name: "description", widget: "text", required: false }
              - { label: "Подпись файла", name: "meta", widget: "string", required: false, hint: "Например: PDF, 1.8 МБ →" }
              - label: "Иконка"
                name: "icon"
                widget: "select"
                default: "file-text"
                hint: "Иконки Phosphor, не эмодзи."
                options:
                  - { label: "Диплом", value: "graduation-cap" }
                  - { label: "Книга", value: "book-open-text" }
                  - { label: "Печать", value: "seal-check" }
                  - { label: "Сертификат", value: "certificate" }
                  - { label: "Медаль", value: "medal" }
                  - { label: "Кубок", value: "trophy" }
                  - { label: "Документ", value: "file-text" }
                  - { label: "Отчёт", value: "notebook" }
                  - { label: "График", value: "chart-line" }
                  - { label: "Мозг", value: "brain" }
                  - { label: "Растение", value: "plant" }
                  - { label: "Лист", value: "leaf" }
                  - { label: "Ребёнок", value: "baby" }
                  - { label: "Рукопожатие", value: "handshake" }
                  - { label: "Семья", value: "users-three" }
                  - { label: "Группа", value: "users" }
                  - { label: "Ладонь", value: "hand-palm" }
                  - { label: "Книги", value: "books" }
                  - { label: "Беседа", value: "chat-teardrop-text" }
                  - { label: "Здание", value: "buildings" }
                  - { label: "Театр", value: "mask-happy" }
                  - { label: "Глобус", value: "globe" }
                  - { label: "Искра", value: "sparkle" }
                  - { label: "Флаг", value: "flag" }
                  - { label: "Молния", value: "lightning" }
                  - { label: "Пазл", value: "puzzle-piece" }
                  - { label: "Дом", value: "house-line" }
                  - { label: "Речь", value: "chat-circle-text" }
                  - { label: "Одежда", value: "t-shirt" }
                  - { label: "Режим дня", value: "clock" }
                  - { label: "Птица", value: "bird" }
                  - { label: "Благодарность", value: "hands-praying" }
                  - { label: "Аплодисменты", value: "hands-clapping" }
                  - { label: "Экология", value: "recycle" }
              - label: "Цвет"
                name: "color"
                widget: "select"
                default: "terracotta"
                options:
                  - { label: "Терракотовый", value: "terracotta" }
                  - { label: "Зелёный", value: "sage" }
                  - { label: "Солнечный", value: "sun" }
                  - { label: "Глиняный", value: "clay" }
              - label: "Файл"
                name: "file"
                widget: "file"
                media_folder: "public/diploms"
                public_folder: "/diploms"
                choose_url: false
                media_library:
                  config:
                    max_file_size: 10485760

