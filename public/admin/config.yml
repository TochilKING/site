                fields:
                  - { label: "Направление", name: "label", widget: "string" }
                  - { label: "1 полугодие, %", name: "base", widget: "number", value_type: "int", min: 0, max: 100, default: 0 }
                  - { label: "2 полугодие, %", name: "value", widget: "number", value_type: "int", min: 0, max: 100, default: 0 }
